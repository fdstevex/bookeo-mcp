[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bookeo-mcp"
version = "1.0.0"
description = "MCP server for Bookeo booking management"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.30.0,<2",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
bookeo-mcp = "bookeo_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bookeo_mcp*"]

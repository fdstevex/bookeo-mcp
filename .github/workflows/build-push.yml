name: Build and Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

# One deploy at a time so runs don't overlap on the VM.
concurrency:
  group: deploy-ovm
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Walks the OAuth flow Claude connectors use against a local server, so
      # a change that would lock them out fails here, before anything ships.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test OAuth flow
        run: |
          pip install --quiet .
          python tests/oauth_e2e.py

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      # The Oracle VM is arm64; amd64 is kept for local runs.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The deploy key is restricted on the VM to running
      # ~/apps/bookeo/deploy.sh, which receives the image tag as the SSH command.
      # The script takes docker-compose.yml from the image, so ovm/ changes
      # deploy from here too; only deploy.sh itself is copied over by hand.
      - name: Deploy to Oracle VM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          OVM_DEPLOY_KEY: ${{ secrets.OVM_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$OVM_DEPLOY_KEY" > ~/.ssh/ovm_deploy
          chmod 600 ~/.ssh/ovm_deploy
          echo "ovm.fallday.ca ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJD//XNLAtsMdDvq+eyCeLbY8+xY8bqTFJk0dPhi13g6" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/ovm_deploy -o StrictHostKeyChecking=yes ubuntu@ovm.fallday.ca "${{ github.sha }}"

      # Connectors find the sign-in endpoints through this metadata; a wrong
      # PUBLIC_URL or a container that did not come up shows here.
      - name: Check the deployed server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          for attempt in $(seq 1 12); do
            if issuer=$(curl -fsS -m 10 https://ekbookeo.fallday.ca/.well-known/oauth-authorization-server | jq -r .issuer); then
              echo "issuer: $issuer"
              [ "${issuer%/}" = "https://ekbookeo.fallday.ca" ] && exit 0
              echo "unexpected issuer" >&2; exit 1
            fi
            sleep 5
          done
          echo "server did not answer with OAuth metadata" >&2; exit 1
